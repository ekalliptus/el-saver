plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ekalliptus.payrelay'
    compileSdk 36

    defaultConfig {
        applicationId "com.ekalliptus.payrelay"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "2.0"
        // Passed at build time: gradlew assembleRelease -PwebhookSecret=...
        buildConfigField "String", "WEBHOOK_URL",
                "\"https://api.ekalliptus.com/cookie-sync/premium/webhook\""
        buildConfigField "String", "WEBHOOK_SECRET",
                "\"${project.findProperty('webhookSecret') ?: ''}\""
    }

    signingConfigs {
        release {
            // Reuse the main app's keystore: release-signed sideloads pass
            // most AV heuristics that flag debug-signed APKs as risky.
            def ksFile = rootProject.file("../android/key.properties")
            if (ksFile.exists()) {
                def props = new Properties()
                ksFile.withInputStream { props.load(it) }
                keyAlias props["keyAlias"]
                keyPassword props["keyPassword"]
                storePassword props["storePassword"]
                // key.properties stores a path relative to android/app/
                storeFile rootProject.file("../android/app/" + props["storeFile"])
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
